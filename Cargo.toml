[workspace]
resolver = "2"
members = ["crates/link-core", "apps/desklink"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["DeskLink contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
